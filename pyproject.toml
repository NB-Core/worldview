[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldview"
version = "0.1.0"
description = "Snapshot dashboard of global economic + market state — valuation, sentiment, macro, geopolitical, energy, breadth."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oliver Brendel", email = "oliver.brendel@strahd.de" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fredapi>=0.5.2",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "tenacity>=8.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",         # Shiller CAPE, modern xlsx files
    "xlrd>=1.2,<2.0",        # legacy .xls (Iacoviello GPR file, AAII spreadsheet)
    "beautifulsoup4>=4.12",  # multpl.com scraper
    "lxml>=5.0",             # bs4 parser backend, also for pandas.read_html if needed
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "httpx>=0.27",          # required by fastapi.testclient
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
worldview-snapshot = "worldview.cli:main"

[tool.setuptools.packages.find]
include = ["worldview*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
worldview = ["store/schema.sql", "webapp/templates/*.html", "webapp/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: hits real network — skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET"]
ignore = ["E501"]  # let formatter handle long lines

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
