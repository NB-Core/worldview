# Field definitions: how metrics roll up into per-field 2×2 quadrants.
#
# Each field has three buckets — valuation, sentiment, macro_risk — each a
# weighted blend of metric percentiles. See analysis/composite.py.
#
# A metric can appear in multiple fields (e.g. HY OAS contributes to overall
# AND finance macro_risk).

fields:

  overall:
    label: "Overall market"
    valuation:
      - buffett_indicator
      - shiller_cape_us
      - sp500_pe
      - sp500_div_yield
      - equity_risk_premium
      - rsp_spy_ratio
      - sp500_top10_share
      - sp500_mag7_share
    sentiment:
      - vix
      - vvix
      - move
      - cnn_fear_greed
      - aaii_bull_bear_spread
      - naaim_exposure
      - hy_oas_us
      - ig_oas_us
      - hy_minus_ig_oas
      - btc_usd
      - mstr
    macro_risk:
      - hy_oas_us
      - hy_minus_ig_oas
      - us_2s10s
      - us_3m10y
      - us_real_10y
      - dxy
      - eur_usd
      - ny_fed_recession_prob
      - gpr_daily
      - gold_copper_ratio

  ai:
    label: "AI / Semis"
    valuation:
      - smh
      - nvda
      - nvda_sp500_share
    sentiment:
      - xlk
      - xlk_xlu_ratio
      - arkk
      - cnn_fear_greed
    macro_risk:
      - hy_oas_us
      - us_real_10y
      - dxy

  construction:
