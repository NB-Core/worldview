      - lmt
      - rtx
    sentiment:
      - vix
    macro_risk:
      - gpr_daily

  defensive:
    label: "Safe-haven / defensives"
    valuation:
      - gold
      - silver
      - tlt
      - xlp
      - xlv
    sentiment:
      - chf_usd
      - vix
    macro_risk:
      - hy_oas_us
      - us_real_10y
      - gpr_daily

# Top-level Worldview Score weights (overall field only).
worldview_score_weights:
  valuation: 0.4
  sentiment: 0.3
  macro_risk: 0.3

# How the sentiment percentile contributes to the Worldview Score.
#
#   penalize_greed (default, Buffett-aligned):
#     100 - sentiment. Fear → helps. Greed → hurts. Macro_risk separately
#     captures "but is the system breaking?" so we don't double-count.
#
#   penalize_extremes (legacy):
#     100 - 2*|sentiment-50|. Rewards neutral, punishes both ends.
#     Mathematically smooth but historically punished March 2009 / March 2020
#     style bottoms — exactly when you wanted to be buying.
worldview_sentiment_mode: penalize_greed
