    field: overall
    source: derived
    source_ref: hy_minus_ig
    polarity: fearful
    score_directions: {sentiment: -1, macro_risk: 1}
    cadence: daily
    flag_high_pct: 90
    weight: 1.0
    notes: "Junk minus IG credit spread. Widening = credit market punishing weaker balance sheets first; often leads equity drawdowns."

