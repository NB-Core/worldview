# Worldview metric registry.
#
# Schema (one row per metric):
#   id            : stable snake_case identifier (used as PK in SQLite)
#   category      : valuation | sentiment | macro | geo | energy | breadth
#   field         : overall | ai | construction | finance | energy | defense | defensive
#   source        : fred | yfinance | cnn_fng | gpr_iacoviello | multpl | derived
#   source_ref    : ticker / FRED series id / URL slug / derived-recipe key
#   polarity      : meaning of HIGH values for this metric
#                   - valuation : "expensive" or "cheap"
#                   - sentiment : "greedy"   or "fearful"
#                   - macro     : "stressed" or "healthy"
#                   - energy    : "expensive" or "cheap"
#   cadence       : daily | weekly | monthly | quarterly
#   flag_high_pct : surface as a flag when current percentile >= this  (null = off)
#   flag_low_pct  : surface as a flag when current percentile <= this  (null = off)
#   weight        : weight in field rollups (default 1.0)
#   notes         : free text for humans

metrics:

  # ══════════════════════════════════════════════════════════════════════════
  # OVERALL — Valuation
  # ══════════════════════════════════════════════════════════════════════════
  # NOTE: FRED retired every public Wilshire 5000 series in 2026
  # (WILL5000PR/PRFC/IND/INDFC all return 'does not exist' or 500). The
  # Buffett Indicator now uses S&P 500 / GDP as a >95%-correlated proxy via
  # the `sp500_div_gdp` derived recipe.

  - id: us_gdp
    category: macro
    field: overall
    source: fred
    source_ref: "GDP"
    polarity: healthy
    cadence: quarterly
    weight: 0.3
    notes: "US Nominal GDP, billions USD, quarterly."

  - id: buffett_indicator
    category: valuation
    field: overall
    source: derived
    source_ref: sp500_div_gdp
    polarity: expensive
    cadence: daily
    flag_high_pct: 90
    flag_low_pct: 10
    weight: 1.5
    notes: "Buffett Indicator (S&P 500 / US GDP variant). The market-cap-to-economy ratio Buffett called 'probably the best single measure of where valuations stand'. We use S&P 500 as the numerator since FRED has retired every public Wilshire 5000 series — the percentile ranking is unaffected (>95% correlation)."

  - id: equity_risk_premium
    category: valuation
    field: overall
    source: derived
    source_ref: earnings_yield_minus_10y
    polarity: cheap         # high ERP = stocks cheap vs bonds
    cadence: daily
    flag_low_pct: 10
    weight: 1.2
    notes: "Equity Risk Premium proxy: S&P 500 earnings yield minus 10Y Treasury. Negative = stocks priced for returns below cash; historically a warning."

  - id: hy_minus_ig_oas
